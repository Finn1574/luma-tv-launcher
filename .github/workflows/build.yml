name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Debug-Keystore erzeugen
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/luma.jks -storepass lumatv \
            -keypass lumatv -alias luma -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Luma TV, O=bolta, C=DE"
      - name: Bauen
        run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: luma-tv-launcher-apk
          path: app/build/outputs/apk/release/app-release.apk
